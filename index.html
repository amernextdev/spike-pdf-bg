<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>spike 10.1d-0</title>
<style>
/* spike 10.1d-0: صفحة تجريبية مستقلة، بتتمسح بعد قرار الخطوة. مش جزء من اللوحة */
@page{size:A4;margin:0}
*{box-sizing:border-box}
:root{--pw:210mm;--ph:297mm;--inset:0mm;--pad:12mm}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,"Segoe UI",system-ui,sans-serif;background:#d9dee5;color:#1B2430}
.tools{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #b8c2cf;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
.tools b{margin-inline-end:6px}
.tools label{margin-inline-end:8px;white-space:nowrap}
.tools button{padding:6px 12px;font:inherit}
.diag{margin:8px 12px;font-size:12px}
.diag pre{white-space:pre-wrap;direction:ltr;text-align:left;background:#fff;padding:8px;margin:4px 0}
#doc{--ink:#1B2430;--muted:#5B6B7C;--line:#E4E9E6;--main:#0F1B2D;--headtext:#fff;--soft:#E8EDF3;--alpha:.6;--panel:rgb(255 255 255 / var(--alpha));
  width:var(--pw);margin:12px auto;color:var(--ink);font-size:13px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#doc[data-mode="dark"]{--ink:#E8EEF5;--muted:#93A3B5;--line:#223048;--main:#1A2540;--headtext:#E8EEF5;--soft:#1A2540;--panel:rgb(11 18 32 / var(--alpha))}
/* محتوى الصفوف (نسخة مصغّرة من Paper.css) */
.r{display:flow-root;padding-block:1px}
.head{background:var(--main);color:var(--headtext);padding:8px 14px;border-bottom:3px solid #FF6A13}
.part{margin:0 0 8px;font-size:17px}
.note{background:var(--soft);padding:8px 12px;border-radius:8px;margin-bottom:8px;white-space:pre-line}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:8px}
.macro{background:var(--soft);padding:8px;border-radius:8px}
.macro b{display:block}
.muted{color:var(--muted)}
.meal{padding:8px 0;border-bottom:1px solid var(--line)}
.meal__head{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin-bottom:4px}
.item{display:flex;justify-content:space-between;gap:12px;padding-block:2px}
.item bdi{color:var(--muted);flex:none}
.day{font-weight:700;padding-block:4px;border-bottom:2px solid var(--line);margin:10px 0 4px}
.ex{padding-block:4px;border-bottom:1px solid var(--line)}
.ex__note{color:var(--muted);white-space:pre-line}
/* الاستراتيجية B: صفحات صريحة. كل صفحة A4 ثابتة وليها خلفيتها */
.pg{position:relative;width:var(--pw);height:var(--ph);margin:0 auto 10mm;overflow:hidden;background:#fff;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg--css{background-size:100% 100%;background-repeat:no-repeat}
.pg__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.pg__inner{position:absolute;inset:var(--inset);padding:var(--pad);background:var(--panel);display:flex;flex-direction:column}
.pg__head{flex:none;margin-bottom:8px}
.pg__rows{flex:1 1 0;min-height:0;overflow:hidden}
.pg__foot{flex:none;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px;margin-top:4px}
.pg--measure{position:absolute;left:-10000px;top:0;visibility:hidden;margin:0}
/* الاستراتيجية A: تكرار CSS على جذر الجزء + جدول thead/tfoot (نفس هيكل Paper الحالي) */
.a-sheet{width:var(--pw);margin:0 auto 10mm;background-color:#fff;background-size:var(--pw) var(--ph);background-repeat:repeat-y;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a-sheet + .a-sheet{break-before:page;page-break-before:always}
.a-page{display:table;width:calc(100% - 2*var(--inset));margin-inline:var(--inset);border-collapse:separate;border-spacing:0;table-layout:fixed}
.a-page thead{display:table-header-group}
.a-page tbody{display:table-row-group}
.a-page tfoot{display:table-footer-group}
.a-row{display:table-row;break-inside:avoid;page-break-inside:avoid}
.a-cell{display:table-cell;padding-inline:var(--pad);background:var(--panel);vertical-align:top}
.a-pad{background:var(--panel);padding-inline:var(--pad)!important}
.a-pad{display:table-cell;padding:0}
.a-fill{height:12mm}
@media print{
  body{background:none}
  .tools,.diag,#measure{display:none!important}
  #doc{margin:0}
  .pg{margin:0;break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .a-sheet{margin:0}
}
</style>
</head>

function buildParts() {
  const nut = [];

  for (let m = 0; m < 8; m++) {

// ---------- B: ترقيم صفحات بالقياس (كل صفحة عنصر A4 مستقل) ----------
function shell(i, n) {
  const sec = document.createElement('section'); sec.className = 'pg' + (S.s === 'bcss' ? ' pg--css' : '');
  if (S.bg !== '0') {
    if (S.s === 'bcss') sec.style.backgroundImage = `url("${urls[S.bg]}")`;
    else { const im = new Image(); im.className = 'pg__bg'; im.alt = ''; im.src = urls[S.bg]; sec.append(im); }
  }
  const inner = document.createElement('div'); inner.className = 'pg__inner';
  inner.innerHTML = `<div class="pg__head">${headHtml}</div><div class="pg__rows"></div><div class="pg__foot"><span>تذييل تجريبي للورقة</span><bdi>${i}/${n}</bdi></div>`;
  sec.append(inner);
  return { sec, rows: inner.querySelector('.pg__rows') };
}
function renderB() {
  const rows = []; buildParts().forEach((p) => p.rows.forEach((r, i) => rows.push({ ...r, newPart: i === 0 })));
  const m = shell(0, 0); m.sec.classList.add('pg--measure'); meas.append(m.sec);
  const cap = m.rows.clientHeight - 1; // السعة الفعلية لمنطقة الصفوف بنفس هيكل الصفحة
  const nodes = rows.map((r) => { const n = r.mk(); m.rows.append(n); return n; });
  rows.forEach((r, i) => { r.h = nodes[i].getBoundingClientRect().height; });
  const c = contNode('x'); m.rows.append(c); const contH = c.getBoundingClientRect().height;
  const pages = []; let cur = null;
  rows.forEach((r, i) => {
    const next = rows[i + 1];
    const need = r.h + (r.keepNext && next && !next.newPart ? next.h : 0);
    if (!cur || r.newPart || cur.used + need > cap) {
      cur = { items: [], used: 0 }; pages.push(cur);
      if (r.day && !r.first) { cur.items.push({ cont: r.day }); cur.used += contH; } // اسم اليوم بيتكرر في صفحة التكملة
    }
    cur.items.push(r); cur.used += r.h;
  });
  const N = pages.length;
  pages.forEach((p, i) => { const s = shell(i + 1, N); p.items.forEach((it) => s.rows.append(it.cont ? contNode(it.cont) : it.mk())); root.append(s.sec); });

}
